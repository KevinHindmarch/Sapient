name: Desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Python dependencies
        run: uv sync --frozen

      - name: Freeze the engine (PyInstaller)
        run: uv run --with pyinstaller==6.22.3 pyinstaller packaging/sapient-api.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: Engine smoke test
        run: uv run python packaging/smoke_engine.py packaging/dist/sapient-api/sapient-api.exe

      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win

      # 1) What users do: the latest published release is installed and has data in it.
      - name: Install the latest published release and save a portfolio in it
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$env:GITHUB_REPOSITORY" --pattern 'Sapient-Setup-*.exe' --dir "$env:RUNNER_TEMP\previous"
          $previous = Get-ChildItem "$env:RUNNER_TEMP\previous\Sapient-Setup-*.exe" | Select-Object -First 1
          Write-Host "previous release: $($previous.Name)"
          Start-Process -FilePath $previous.FullName -ArgumentList '/S', "/D=$env:RUNNER_TEMP\SapientApp" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\SapientApp\Sapient.exe")) { throw "previous release was not installed" }
          node e2e/smoke.mjs "$env:RUNNER_TEMP\SapientApp\Sapient.exe" "$env:RUNNER_TEMP" --mode seed

      # 2) Installing this build over it keeps the profile, the portfolio and skips the wizard.
      - name: Upgrade from the latest release keeps data
        working-directory: desktop
        shell: pwsh
        run: |
          $db = "$env:APPDATA\Sapient\sapient.db"
          if (-not (Test-Path $db)) { throw "expected the previous release to create $db" }
          $installer = Get-ChildItem release/Sapient-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$env:RUNNER_TEMP\SapientApp" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\SapientApp\resources\engine\sapient-api.exe")) { throw "engine missing" }
          if (-not (Test-Path $db)) { throw "upgrade removed the database" }
          node e2e/smoke.mjs "$env:RUNNER_TEMP\SapientApp\Sapient.exe" "$env:RUNNER_TEMP" --mode upgraded

      # 3) A brand-new PC: the welcome wizard runs once, then never again.
      - name: Fresh install shows the welcome wizard
        working-directory: desktop
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:APPDATA\Sapient"
          node e2e/smoke.mjs "$env:RUNNER_TEMP\SapientApp\Sapient.exe" "$env:RUNNER_TEMP" --mode fresh

      - name: Reinstalling the same version keeps data
        working-directory: desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/Sapient-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$env:RUNNER_TEMP\SapientApp" -Wait
          node e2e/smoke.mjs "$env:RUNNER_TEMP\SapientApp\Sapient.exe" "$env:RUNNER_TEMP" --mode upgraded

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sapient-windows-installer
          path: |
            desktop/release/Sapient-Setup-*.exe
            ${{ runner.temp }}/*.png
          if-no-files-found: warn
          retention-days: 14
