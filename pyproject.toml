[project]
name = "sapient"
version = "0.1.0"
description = "Sapient - ASX and US stock portfolio optimiser with IBKR TWS integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "protobuf>=5.29",  # imported by recent official IBKR TWS API versions (loaded from the user's install)
    "tzdata>=2024.1",  # time zones for market hours (Windows has no system tz database)
    "scipy>=1.16.2",
    "uvicorn>=0.40.0",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = ["httpx>=0.28.1"]
